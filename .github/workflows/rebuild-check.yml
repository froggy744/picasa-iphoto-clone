name: Rebuild check

on:
  push:
    branches:
      - rebuild/prototype-rc-shell
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - name: Cargo check
        run: cargo check
