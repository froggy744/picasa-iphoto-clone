name: Library redesign check

on:
  push:
    branches:
      - integration/library-redesign
  workflow_dispatch:

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libsmbclient-dev libnfs-dev
      - name: Cargo check
        run: cargo check --quiet
      - name: Gallery V2 tests
        run: cargo test --quiet gallery_v2
