name: Sectioned Folder Compile Check

on:
  push:
    branches:
      - ci-sectioned-folder-check
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential pkg-config cmake nasm             libgtk-4-dev libadwaita-1-dev             libsmbclient-dev libnfs-dev
      - name: Cargo check
        run: cargo check --bin pic-rs
      - name: Cargo tests
        run: cargo test --bin pic-rs
