<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
    width="2172"
    height="724"
    viewBox="0 0 2172 724">
  <title>Responsive bookshelf row template</title>
  <desc>
    Design at 2172 by 724 pixels and render as one 288-logical-pixel row.
    The album-safe area ends at the shelf surface on y=590. Hide the GUIDES
    layer before exporting the finished bookshelf background.
  </desc>

  <defs>
    <linearGradient id="wood-placeholder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5aa73"/>
      <stop offset="1" stop-color="#b77e45"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Replace this layer with the new wood/background artwork. -->
  <g inkscape:groupmode="layer" inkscape:label="ARTWORK - replace this" id="artwork">
    <rect width="2172" height="724" fill="url(#wood-placeholder)"/>
    <rect width="2172" height="724" fill="url(#grid)"/>

    <!-- Placeholder shelf: keep its top surface on y=590. -->
    <path d="M 0 590 H 2172 V 660 H 0 Z" fill="#8c552c"/>
    <path d="M 0 590 H 2172 V 602 H 0 Z" fill="#f0c78e"/>
    <path d="M 0 660 H 2172 V 724 H 0 Z" fill="#6f3d20" opacity="0.55"/>
  </g>

  <!-- Hide or delete this entire layer before export. -->
  <g inkscape:groupmode="layer" inkscape:label="GUIDES - hide before export" id="guides">
    <!-- Horizontal crop/shift allowance. -->
    <rect x="0" y="0" width="136" height="724" fill="#d7263d" opacity="0.20"/>
    <rect x="2036" y="0" width="136" height="724" fill="#d7263d" opacity="0.20"/>
    <path d="M 136 0 V 724 M 2036 0 V 724" stroke="#ffdf00" stroke-width="4" stroke-dasharray="16 12"/>

    <!-- Album placement area. -->
    <rect x="136" y="20" width="1900" height="570" fill="#1f9d55" opacity="0.16"/>
    <path d="M 0 590 H 2172" stroke="#00e5ff" stroke-width="6"/>
    <path d="M 0 0 H 2172 M 0 723 H 2172" stroke="#ff4fd8" stroke-width="4" stroke-dasharray="20 12"/>
    <path d="M 1086 0 V 724" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="12 12"/>

    <!-- Dimension callouts. -->
    <path d="M 2110 20 V 582" stroke="#ffffff" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="2086" y="305" fill="#ffffff" font-family="sans-serif" font-size="30" text-anchor="middle"
          transform="rotate(-90 2086 305)">570 px album-safe height</text>

    <g font-family="sans-serif" fill="#ffffff" stroke="#24170e" stroke-width="6" paint-order="stroke fill">
      <text x="1086" y="56" font-size="34" text-anchor="middle">2172 × 724 px source • rendered as one 288 px-high row</text>
      <text x="1086" y="104" font-size="26" text-anchor="middle">Keep important detail inside the yellow lines; side regions may crop or stretch</text>
      <text x="1086" y="554" font-size="30" text-anchor="middle">ALBUM SAFE AREA — cover bottoms meet the cyan line</text>
      <text x="1086" y="584" font-size="23" text-anchor="middle">SHELF SURFACE: y = 590 source / y = 235 rendered</text>
      <text x="160" y="700" font-size="22">Bottom edge must join the top edge cleanly when repeated vertically</text>
    </g>
  </g>
</svg>
