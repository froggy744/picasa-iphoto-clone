[package]
name = "pic-rs"
version = "1.0.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
kamadak-exif = "0.6"
anyhow = "1"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
gio = "0.21"
glib = "0.21"
gtk4 = { version = "0.10", features = ["v4_12"] }
libadwaita = { version = "0.8", features = ["v1_5"] }
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp"] }

[profile.dev]
opt-level = 1
